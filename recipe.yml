name: 'Seeds template'
description: 'A Seeds site with our feature recipes ready to add from Extend > Browse: News & Events, Local Reach, Slider, FAQ, Gallery, Partners, Team, Publications, Contact form and Newsletter.'
type: Site
recipes:
  - seeds_base
install:
  # Optional Seeds modules that we turn on for every site. (Seeds Performance
  # is offered as an add-on instead.) Pages are built with Canvas (below), not
  # Layout Builder, so Seeds Layouts and Seeds Page are not used.
  - seeds_seo
  - seeds_administration
  # Seeds SEO's dependencies, listed so their default config is imported.
  - metatag
  - metatag_open_graph
  - simple_sitemap
  - redirect
  - length_indicator
  # SEO fields: the SEO analysis field (Yoast) and fallback tokens such as
  # [node:field_seo_title|node:title] in the meta tag defaults.
  - yoast_seo
  - token_or
  # Manage fields, Manage form display and Manage display screens. A fresh
  # Seeds site leaves this off, but site builders need it.
  - field_ui
  - project_browser
  # Gives Project Browser its one-click Install button. Package Manager is
  # still experimental in Drupal 11.4: each project must set
  # $settings['testing_package_manager'] = TRUE; in settings.php.
  - package_manager
  # ECA (automation): the same modules Drupal CMS enables, plus the visual
  # modeler. Ships the "add SEO fields to new content types" model.
  - eca
  - eca_base
  - eca_config
  - eca_content
  - eca_form
  - eca_misc
  - eca_render
  - eca_ui
  - eca_user
  - modeler
  # Editor experience, adopted from Drupal CMS after testing. Left out after
  # testing on Seeds: Autosave Form (broke Media Library uploads), Media File
  # Delete (deletes files that Trash should keep restorable), SAM (hides links
  # typed after a failed save), Tagify (broken in Arabic) and Media Library
  # Bulk Upload (barely maintained).
  - scheduler
  - media_library_edit
  - svg_image
  - dashboard
  - login_emailusername
  # Languages and navigation, adopted from Drupal CMS.
  - config_language_lock
  - easy_breadcrumb
  # Visual page building with Drupal Canvas, the page builder Drupal CMS uses.
  # Needs the restrict_ip patch listed in the Seeds base README.
  - canvas
  # Images: responsive image styles (config/: WebP sizes from 480 to 2400px
  # wide; the Seeds site theme picks one per view mode), and SVG in image
  # media (svg_image, above, shows SVGs at their own size).
  - responsive_image
  # Promo card fields on menu links (config/): an image, a label and a
  # link, shown in the menu panel of a top-level item by the Seeds site theme.
  - link
  - media_library
  - field_group
config:
  # Field storages influence the database layout, so they must match exactly.
  # Every feature recipe with its own pages ships the same storages.
  strict:
    - field.storage.node.field_meta_tags
    - field.storage.node.field_seo_analysis
    - field.storage.node.field_seo_description
    - field.storage.node.field_seo_image
    - field.storage.node.field_seo_title
  # A recipe skips a module's default config, so bring it in for the modules
  # above: meta tag defaults, sitemap settings.
  import:
    seeds_administration: '*'
    metatag: '*'
    simple_sitemap: '*'
    redirect: '*'
    yoast_seo: '*'
    scheduler: '*'
    easy_breadcrumb: '*'
    # Canvas needs its own config (image styles, text formats) to work at all.
    # Its two CKEditor configs are left out: with Editor Advanced Link on Seeds
    # they fail validation. The global asset library ships empty in config/
    # (site styles belong in the theme), the same one Seeds site uses.
    canvas:
      - canvas.brand_kit.global
      - canvas.component.marker.page_content
      - canvas.settings
      - filter.format.canvas_html_block
      - filter.format.canvas_html_inline
      - image.style.canvas_avatar
      - image.style.canvas_parametrized_width
  actions:
    # Image media accept SVG (logos, icons) and WebP besides PNG, GIF and JPEG.
    field.field.media.image.field_image:
      set:
        property_name: settings
        value:
          handler: 'default:file'
          handler_settings: {  }
          file_directory: '[date:custom:Y]-[date:custom:m]'
          file_extensions: 'png gif jpg jpeg webp svg'
          max_filesize: ''
          max_resolution: ''
          min_resolution: ''
          alt_field: true
          alt_field_required: false
          title_field: true
          title_field_required: false
          default_image:
            uuid: ''
            alt: ''
            title: ''
            width: null
            height: null
    # Show our feature recipes as "Recommended add-ons". The list ships with
    # this recipe (content/file/recommended-add-ons.yaml).
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'public://recommended-add-ons.yaml'
            ttl: 86400
        default_source: recommended
        # One-click Install for editors. The recipes are already downloaded
        # with the template, so Install only applies them.
        allow_ui_install: true
        max_selections: 1

    # Meta tags for all content. Each tag uses the first value that is filled
    # in: the SEO fields first, then the Seeds fields every feature recipe
    # shares (field_body, field_media). Seeds image media keeps its file in
    # field_image.
    metatag.metatag_defaults.node:
      set:
        property_name: tags
        value:
          canonical_url: '[node:url]'
          title: '[node:field_seo_title|node:title] | [site:name]'
          description: '[node:field_seo_description|node:field_body:summary|node:field_body-smart-trim]'
          og_type: article
          og_url: '[node:url]'
          og_site_name: '[site:name]'
          og_title: '[node:field_seo_title|node:title]'
          og_description: '[node:field_seo_description|node:field_body:summary|node:field_body-smart-trim]'
          og_image: '[node:field_seo_image:entity:field_image:seeds_social|node:field_media:entity:field_image:seeds_social]'
          og_image_width: '[node:field_seo_image:entity:field_image:seeds_social:width|node:field_media:entity:field_image:seeds_social:width]'
          og_image_height: '[node:field_seo_image:entity:field_image:seeds_social:height|node:field_media:entity:field_image:seeds_social:height]'
          og_image_alt: '[node:field_seo_image:entity:field_image:alt|node:field_media:entity:field_image:alt]'
          og_updated_time: '[node:changed:custom:c]'
    metatag.settings:
      simpleConfigUpdate:
        # Body text can be long: keep descriptions to what search engines show.
        tag_trim_maxlength.metatag_maxlength_description: 160
        tag_trim_maxlength.metatag_maxlength_og_description: 200

    # Same editor settings as Drupal CMS.
    scheduler.settings:
      simpleConfigUpdate:
        hide_seconds: true
    easy_breadcrumb.settings:
      simpleConfigUpdate:
        applies_admin_routes: false
        add_structured_data_json_ld: true
        hide_single_home_item: true
        capitalizator_mode: none
