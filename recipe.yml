name: 'Seeds template'
description: 'A Seeds site with our feature recipes ready to add from Extend > Browse: News & Events, Local Reach, Slider, FAQ, Gallery, Partners, Team, Publications, Contact form and Newsletter.'
type: Site
recipes:
  - seeds_base
install:
  # Optional Seeds modules that we turn on for every site. (Seeds Page and
  # Seeds Performance are offered as add-ons instead.)
  - seeds_layouts
  - seeds_seo
  - seeds_administration
  # Seeds Page's config needs it but Seeds Page does not declare it, so the
  # Seeds Page add-on cannot be enabled without it.
  - responsive_image_preload
  # Seeds SEO's dependencies, listed so their default config is imported.
  - metatag
  - simple_sitemap
  - redirect
  # Manage fields, Manage form display and Manage display screens. A fresh
  # Seeds site leaves this off, but site builders need it.
  - field_ui
  - project_browser
  # Gives Project Browser its one-click Install button. Package Manager is
  # still experimental in Drupal 11.4: each project must set
  # $settings['testing_package_manager'] = TRUE; in settings.php.
  - package_manager
config:
  # A recipe skips a module's default config, so bring it in for the modules
  # above: column and layout settings, meta tag defaults, sitemap settings.
  import:
    seeds_layouts: '*'
    seeds_administration: '*'
    metatag: '*'
    simple_sitemap: '*'
    redirect: '*'
  actions:
    # Show our feature recipes as "Recommended add-ons". The list ships with
    # this recipe (content/file/recommended-add-ons.yaml).
    project_browser.admin_settings:
      simpleConfigUpdate:
        enabled_sources:
          recommended:
            uri: 'public://recommended-add-ons.yaml'
            ttl: 86400
        default_source: recommended
        # One-click Install for editors. The recipes are already downloaded
        # with the template, so Install only applies them.
        allow_ui_install: true
        max_selections: 1
